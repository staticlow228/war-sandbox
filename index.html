<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>War Sandbox Ukraine</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{background:#000;color:#e2e8f0;overflow:hidden;height:100vh}
#map{position:absolute;inset:0;background:#000;z-index:1;touch-action:none}
.hidden{display:none!important}
#load{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;text-align:center;padding:20px;color:#e2e8f0}
#load .title{font-size:28px;font-weight:800;color:#facc15;margin-bottom:10px;letter-spacing:1px;text-shadow:0 2px 10px rgba(250,204,21,0.4)}
#load .sub{font-size:14px;color:#94a3b8;margin-bottom:20px}
#load .spinner{width:40px;height:40px;border:3px solid #1e293b;border-top-color:#facc15;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:14px}
#load .status{font-size:13px;color:#cbd5e1}
@keyframes spin{to{transform:rotate(360deg)}}

#sideSelect{position:fixed;inset:0;z-index:9998;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
#sideSelect .title{font-size:28px;font-weight:800;color:#facc15;letter-spacing:1px}
#sideSelect .sub{font-size:14px;color:#94a3b8}
#sideSelect .sideRow{display:flex;gap:14px;margin-top:20px;flex-wrap:wrap;justify-content:center}
#sideSelect .sideBtn{width:140px;height:140px;border-radius:18px;border:3px solid #1e293b;background:#0f172a;color:#fff;font-size:18px;font-weight:700;cursor:pointer;line-height:1.8;transition:all .2s}
#sideSelect .sideBtn:active{transform:scale(0.95);border-color:#facc15}
#sideSelect .sideBtn[data-side="UKR"]{background:#1e3a8a;border-color:#3b82f6}
#sideSelect .sideBtn[data-side="RUS"]{background:#7f1d1d;border-color:#ef4444}
#sideSelect .sliderBlock{margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:6px}
#sideSelect input[type=range]{width:200px}
#sideSelect #aiSpeedLabel{color:#facc15;font-weight:700;font-size:18px}

#panel{position:absolute;bottom:10px;left:8px;width:240px;background:rgba(0,0,0,.95);border:1px solid #1e293b;padding:10px;border-radius:12px;z-index:1000;font-size:11px;max-height:80vh;overflow-y:auto}
#panel .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#panel .header span{font-weight:600;color:#cbd5e1}
#panel .closeBtn{background:transparent;border:none;color:#94a3b8;font-size:18px;cursor:pointer;padding:0 5px;line-height:1}
#panel .row{display:flex;gap:6px;margin-bottom:8px}
#panel .brush{flex:1;padding:12px 4px;border-radius:8px;color:#fff;border:2px solid #1e293b;font-size:11px;cursor:pointer;font-weight:600;text-align:center}
#panel .brush.active{border-color:#facc15}
#panel .brush.b-red{background:#dc2626}
#panel .brush.b-blue{background:#2563eb}
#panel .section{border-top:1px solid #1e293b;margin-top:8px;padding-top:8px}
#panel .sectionTitle{color:#94a3b8;font-size:10px;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;font-weight:600}
#panel .mapBtn{display:block;width:100%;padding:8px;margin-bottom:4px;background:#0f172a;color:#e2e8f0;border:1px solid #1e293b;border-radius:6px;font-size:11px;cursor:pointer;text-align:left;font-weight:600}
#panel .mapBtn.active{background:#1e293b;border-color:#facc15;color:#fff}
#panel button.act{width:100%;padding:10px;margin-top:5px;background:#1e293b;color:#fff;border:none;border-radius:6px;font-size:11px;cursor:pointer;font-weight:600}
#panel button.act.active{background:#facc15;color:#111}
#panel button.danger{background:#7f1d1d}
#panel .hintTxt{color:#94a3b8;text-align:center;margin-top:6px;font-size:10px;line-height:1.4}

#openBtn{position:absolute;bottom:10px;left:8px;width:44px;height:44px;background:rgba(0,0,0,.95);border:1px solid #1e293b;border-radius:50%;color:#e2e8f0;font-size:20px;cursor:pointer;z-index:1000;display:flex;align-items:center;justify-content:center}

#turnPanel{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.95);border:1px solid #1e293b;padding:10px 16px;border-radius:12px;z-index:1500;display:flex;gap:12px;align-items:center;font-size:13px;font-weight:600}
#turnPanel .blue{color:#60a5fa}
#turnPanel .red{color:#f87171}
#turnPanel button{background:#1e293b;color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
#turnPanel button:active{background:#334155}
#turnPanel button:disabled{opacity:.4;cursor:not-allowed}

#hint{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(250,204,21,.95);color:#111;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;z-index:2000;max-width:80vw;text-align:center;display:none}

#toasts{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);z-index:2500;display:flex;flex-direction:column;gap:6px;align-items:center;max-width:90vw;pointer-events:none}
.toast{padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;box-shadow:0 4px 20px rgba(0,0,0,0.5);max-width:90vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.red{background:rgba(220,38,38,0.95);color:#fff;border:2px solid #fca5a5}
.toast.blue{background:rgba(37,99,235,0.95);color:#fff;border:2px solid #93c5fd}
.toast.gray{background:rgba(250,204,21,0.95);color:#111}
</style>
</head>

<div id="map"></div>

<div id="load">
  <div class="title">⚔️ War Sandbox Ukraine</div>
  <div class="sub">Военная песочница</div>
  <div class="spinner"></div>
  <div class="status" id="loadStatus">Загрузка карты...</div>
</div>

<div id="sideSelect">
  <div class="title">⚔️ War Sandbox Ukraine</div>
  <div class="sub">Выбери сторону</div>
  <div class="sideRow">
    <button class="sideBtn" data-side="UKR">🇺🇦<br>Украина</button>
    <button class="sideBtn" data-side="RUS">🇷🇺<br>Россия</button>
  </div>
  <div class="sliderBlock">
    <div class="sub">Атак ИИ за ход</div>
    <input type="range" id="aiSpeed" min="1" max="5" value="2">
    <div id="aiSpeedLabel">2</div>
  </div>
</div>

<div id="turnPanel" class="hidden">
  <div id="turnLabel"><span class="blue">🔵 Ваш ход</span></div>
  <button id="endTurnBtn">✅ Завершить ход</button>
</div>

<button id="openBtn" class="hidden">🎨</button>

<div id="panel" class="hidden">
  <div class="header">
    <span>🎨 Панель</span>
    <button class="closeBtn" id="closeBtn">✕</button>
  </div>
  <div class="row">
    <button class="brush b-red active" id="brushBtn"></button>
  </div>
  <div class="section">
    <div class="sectionTitle">🗺 Карта</div>
    <button class="mapBtn active" data-map="voyager">🗺 Google-стиль</button>
    <button class="mapBtn" data-map="osm">🗺 OpenStreetMap</button>
    <button class="mapBtn" data-map="topo">🌍 Топо</button>
    <button class="mapBtn" data-map="dark">🌑 Тёмная</button>
  </div>
  <button class="act" id="drawBtn">✏️ Включить кисть</button>
  <button class="act danger" id="undoBtn">↩ Убрать последний</button>
  <button class="act danger" id="clearBtn">🗑 Убрать всё</button>
  <div class="hintTxt" id="hintTxt">Твой ход</div>
</div>

<div id="hint"></div>
<div id="toasts"></div>

  var cityOwners = {};

  function init(){
    map = L.map('map', {zoomControl:true, attributionControl:false}).setView([50, 34], 6);
    setMapLayer('voyager');

    document.querySelectorAll('.mapBtn').forEach(function(btn){
      btn.addEventListener('click', function(){
        document.querySelectorAll('.mapBtn').forEach(function(x){ x.classList.remove('active'); });
        btn.classList.add('active');
        setMapLayer(btn.getAttribute('data-map'));
      });
    });

    document.getElementById('drawBtn').addEventListener('click', toggleDraw);
    document.getElementById('undoBtn').addEventListener('click', undoLast);
    document.getElementById('clearBtn').addEventListener('click', function(){
      strokes = []; redrawAll(); saveAll();
    });
    document.getElementById('closeBtn').addEventListener('click', function(){
      document.getElementById('panel').classList.add('hidden');
      document.getElementById('openBtn').classList.remove('hidden');
    });
    document.getElementById('openBtn').addEventListener('click', function(){
      document.getElementById('panel').classList.remove('hidden');
      document.getElementById('openBtn').classList.add('hidden');
    });
    document.getElementById('endTurnBtn').addEventListener('click', endTurn);
    document.getElementById('aiSpeed').addEventListener('input', function(){
      aiSpeed = parseInt(this.value);
      document.getElementById('aiSpeedLabel').textContent = aiSpeed;
    });

    document.querySelectorAll('.sideBtn').forEach(function(btn){
      btn.addEventListener('click', function(){
        startGame(btn.getAttribute('data-side'));
      });
    });

    var container = map.getContainer();
    container.addEventListener('touchstart', handleStart, {passive:false});
    container.addEventListener('touchmove', handleMove, {passive:false});
    container.addEventListener('touchend', handleEnd, {passive:false});
    container.addEventListener('touchcancel', handleEnd, {passive:false});
    container.addEventListener('mousedown', handleStart);
    container.addEventListener('mousemove', handleMove);
    container.addEventListener('mouseup', handleEnd);
    container.addEventListener('mouseleave', handleEnd);

    loadData();
  }

  function setMapLayer(type) {
    if (baseLayer) { map.removeLayer(baseLayer); baseLayer = null; }
    var url, opts = {};
    if (type === 'voyager') {
      url = 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
      opts.maxZoom = 20; opts.subdomains = 'abcd';
    } else if (type === 'osm') {
      url = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
      opts.maxZoom = 19;
    } else if (type === 'topo') {
      url = 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png';
      opts.maxZoom = 17; opts.subdomains = 'abc';
    } else if (type === 'dark') {
      url = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
      opts.maxZoom = 20; opts.subdomains = 'abcd';
    }
    baseLayer = L.tileLayer(url, opts).addTo(map);
    fillLayers.forEach(function(l){ if (map.hasLayer(l)) l.bringToFront(); });
    cityMarkers.forEach(function(m){ if (map.hasLayer(m)) m.bringToFront(); });
  }

  function saveAll() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        mySide: mySide, strokes: strokes, hiddenStrokes: hiddenStrokes, aiSpeed: aiSpeed
      }));
    } catch(e){}
  }
  function loadAll() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      var d = JSON.parse(raw);
      if (!d || !d.mySide) return false;
      mySide = d.mySide;
      strokes = d.strokes || [];
      hiddenStrokes = d.hiddenStrokes || [];
      aiSpeed = d.aiSpeed || 2;
      return true;
    } catch(e){ return false; }
  }

  function setStatus(t) {
    var el = document.getElementById('loadStatus');
    if (el) el.textContent = t;
  }

  function loadData(){
    setStatus('Скачиваем границы (10m, ~30 сек)...');
    fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_admin_0_countries.geojson')
      .then(function(r){ return r.json(); })
      .then(function(data){
        var ukr = data.features.find(function(f){
          var c = f.properties.ADM0_A3 || f.properties.adm0_a3 || '';
          return c === 'UKR';
        });
        var rus_full = data.features.find(function(f){
          var c = f.properties.ADM0_A3 || f.properties.adm0_a3 || '';
          return c === 'RUS';
        });
        if (!ukr || !rus_full) { setStatus('Не нашёл страны'); return; }

        setStatus('Обрезаем Россию по Уралу...');
        var clipBox = turf.bboxPolygon([19, 41, 60, 82]);
        var rus = null;
        try { rus = turf.intersect(rus_full, clipBox); } catch(e){ rus = rus_full; }
        if (!rus) rus = rus_full;

        UKR = ukr;
        RUS = rus;

        var unionAll = null;
        try { unionAll = turf.union(UKR, RUS); } catch(e){ unionAll = UKR; }
        L.geoJSON(unionAll, {style:{color:'#000000',weight:2.5,fillOpacity:0,opacity:0.85}, interactive:false}).addTo(map);

        try { map.fitBounds(L.geoJSON(UKR).getBounds(), {padding:[20,20]}); } catch(e){}
        drawCities();

        document.getElementById('load').style.display = 'none';

        if (loadAll() && mySide) {
          startGame(mySide, true);
        } else {
          document.getElementById('sideSelect').style.display = 'flex';
        }
      }).catch(function(e){ setStatus('Ошибка: ' + e.message); });
  }

  function startGame(side, restored){
    mySide = side;
    playerColor = (side === 'UKR') ? '#2563eb' : '#dc2626';
    aiColor = (side === 'UKR') ? '#dc2626' : '#2563eb';
    currentColor = playerColor;

    // Скрытые слои только если их нет
    if (!hiddenStrokes.length) {
      var enemySide = (side === 'UKR') ? 'RUS' : 'UKR';
      var enemyFeature = (enemySide === 'UKR') ? UKR : RUS;
      var myFeature = (side === 'UKR') ? UKR : RUS;
      hiddenStrokes.push({ feature: enemyFeature, color: aiColor, hidden: true });
      hiddenStrokes.push({ feature: myFeature, color: playerColor, hidden: true });
      // Изначально все НП принадлежат своей стороне
      CITIES.forEach(function(c){
        var pt = turf.point([c.lon, c.lat]);
        try {
          if (turf.booleanPointInPolygon(pt, myFeature)) cityOwners[c.name] = playerColor;
          else if (turf.booleanPointInPolygon(pt, enemyFeature)) cityOwners[c.name] = aiColor;
        } catch(e){}
      });
    }

    // Красим кнопку кисти
    var brushBtn = document.getElementById('brushBtn');
    brushBtn.className = 'brush active ' + (playerColor === '#2563eb' ? 'b-blue' : 'b-red');
    brushBtn.textContent = (playerColor === '#2563eb' ? '🔵 Синий' : '🔴 Красный');

    document.getElementById('sideSelect').style.display = 'none';
    document.getElementById('panel').classList.remove('hidden');
    document.getElementById('turnPanel').classList.remove('hidden');
    document.getElementById('aiSpeed').value = aiSpeed;
    document.getElementById('aiSpeedLabel').textContent = aiSpeed;

    turn = 'player';
    updateTurnUI();
    redrawAll();

    if (!restored) showToast('🎮 Игра началась', playerColor);
  }

  function drawCities() {
    CITIES.forEach(function(c){
      var marker = L.circleMarker([c.lat, c.lon], {
        radius: 2.5, color: '#ffffff', weight: 1,
        fillColor: '#000000', fillOpacity: 0.6, interactive: false
      }).addTo(map);
      cityMarkers.push(marker);
    });
  }

  function updateTurnUI() {
    var label = document.getElementById('turnLabel');
    var btn = document.getElementById('endTurnBtn');
    if (turn === 'player') {
      label.innerHTML = '<span class="blue">🔵 Ваш ход</span>';
      btn.disabled = false;
    } else {
      label.innerHTML = '<span class="red">🔴 Ход ИИ...</span>';
      btn.disabled = true;
    }
  }

  function endTurn() {
    if (turn !== 'player') return;
    turn = 'ai';
    updateTurnUI();
    setTimeout(aiTurn, 800);
  }

  function aiTurn() {
    // Находим все НП игрока (это наши цели)
    var targets = CITIES.filter(function(c){ return cityOwners[c.name] === playerColor; });
    if (!targets.length) {
      turn = 'player'; updateTurnUI();
      return;
    }

    // Находим все свои НП
    var myCities = CITIES.filter(function(c){ return cityOwners[c.name] === aiColor; });

    // Сортируем цели по близости к своим
    targets.forEach(function(t){
      var minD = 9999;
      myCities.forEach(function(m){
        var d = Math.sqrt(Math.pow(t.lat - m.lat, 2) + Math.pow(t.lon - m.lon, 2));
        if (d < minD) minD = d;
      });
      t._dist = minD;
    });
    targets.sort(function(a,b){ return a._dist - b._dist; });

    // Ограничение: радиус 12 км + max N атак
    var attacks = Math.min(aiSpeed, targets.length);
    var captured = 0;
    var capturedNames = [];

    for (var i = 0; i < attacks; i++) {
      var t = targets[i];
      var circle = turf.circle([t.lon, t.lat], AI_RADIUS_KM, {units:'kilometers'});
      var changed = applyAiAttack(circle, aiColor);
      if (changed) {
        captured++;
        capturedNames.push(t.name);
      }
    }

    showToast('🤖 ИИ атаковал ' + captured + ' НП', aiColor);
    redrawAll();
    saveAll();

    setTimeout(function(){
      turn = 'player';
      updateTurnUI();
    }, 700);
  }

  function applyAiAttack(shape, color) {
    var enemyColor = (color === '#dc2626') ? '#2563eb' : '#dc2626';

    // Разбиваем по странам
    var partUkr = null, partRus = null;
    try { partUkr = turf.intersect(shape, UKR); } catch(e){}
    try { partRus = turf.intersect(shape, RUS); } catch(e){}

    var parts = [];
    var isUkrSide = (color === '#2563eb');

    // Собираем врага (включая скрытые)
    var allEnemy = strokes.concat(hiddenStrokes).filter(function(s){ return s.color === enemyColor; });

    if (isUkrSide) {
      if (partUkr) parts.push(partUkr);
      if (partRus) {
        allEnemy.forEach(function(s){
          try {
            var inter = turf.intersect(partRus, s.feature);
            if (inter) parts.push(inter);
          } catch(e){}
        });
      }
    } else {
      if (partRus) parts.push(partRus);
      if (partUkr) {
        allEnemy.forEach(function(s){
          try {
            var inter = turf.intersect(partUkr, s.feature);
            if (inter) parts.push(inter);
          } catch(e){}
        });
      }
    }

    if (!parts.length) return false;

    var finalShape = parts[0];
    for (var i = 1; i < parts.length; i++) {
      try { finalShape = turf.union(finalShape, parts[i]); } catch(e){}
    }

    // Отмечаем НП
    CITIES.forEach(function(c){
      var pt = turf.point([c.lon, c.lat]);
      try {
        if (turf.booleanPointInPolygon(pt, finalShape)) cityOwners[c.name] = color;
      } catch(e){}
    });

    // Вытесняем врага
    var newStrokes = [];
    strokes.forEach(function(s){
      if (s.color !== enemyColor) { newStrokes.push(s); return; }
      try {
        var diff = turf.difference(s.feature, finalShape);
        if (diff) newStrokes.push({ feature: diff, color: s.color });
      } catch(e){ newStrokes.push(s); }
    });
    strokes = newStrokes;

    // И из скрытых
    var newHidden = [];
    hiddenStrokes.forEach(function(s){
      if (s.color !== enemyColor) { newHidden.push(s); return; }
      try {
        var diff = turf.difference(s.feature, finalShape);
        if (diff) newHidden.push({ feature: diff, color: s.color, hidden: true });
      } catch(e){ newHidden.push(s); }
    });
    hiddenStrokes = newHidden;

    strokes.push({ feature: finalShape, color: color });
    return true;
  }

  function toggleDraw(){
    if (turn !== 'player') { showHint('Сейчас ход ИИ'); return; }
    drawMode = !drawMode;
    var btn = document.getElementById('drawBtn');
    if (drawMode) {
      btn.textContent = '✖ Стоп';
      btn.classList.add('active');
      map.dragging.disable();
    } else {
      btn.textContent = '✏️ Включить кисть';
      btn.classList.remove('active');
      map.dragging.enable();
      cancelStroke();
    }
  }

  function cancelStroke() {
    if (currentPreview) { map.removeLayer(currentPreview); currentPreview = null; }
    if (startMarker) { map.removeLayer(startMarker); startMarker = null; }
    currentPoints = [];
  }

  function getLatLng(e) {
    var t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
    return map.mouseEventToLatLng(t);
  }

  function handleStart(e){
    if (!drawMode) return;
    if (e.touches && e.touches.length > 1) return;
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    var ll = getLatLng(e);
    currentPoints = [ll];
    startMarker = L.marker(ll, {
      icon: L.divIcon({
        className: '',
        html: '<div style="font-size:24px;line-height:1;filter:drop-shadow(0 2px 4px #000)">✏️</div>',
        iconSize: [24,24], iconAnchor: [12,12]
      }),
      interactive: false
    }).addTo(map);
    currentPreview = L.polygon(currentPoints, {
      color: '#facc15', weight: 3, opacity: 0.9,
      fillColor: currentColor, fillOpacity: 0.2, dashArray: '5,5'
    }).addTo(map);
  }

  function handleMove(e){
    if (!drawMode || !currentPreview) return;
    e.preventDefault();
    var ll = getLatLng(e);
    currentPoints.push(ll);
    currentPreview.setLatLngs(currentPoints);
  }

  function handleEnd(e){
    if (!drawMode || !currentPreview) return;
    e.preventDefault();
    var pts = currentPoints.slice();
    cancelStroke();
    if (pts.length < 3) { showHint('Слишком коротко'); return; }
    var arr = pts.map(function(ll){ return [ll.lat, ll.lng]; });
    addStroke(arr, currentColor);
  }

  function intersectWithColor(feature, targetColor) {
    var parts = [];
    strokes.concat(hiddenStrokes).forEach(function(s){
      if (s.color !== targetColor) return;
      try {
        var inter = turf.intersect(feature, s.feature);
        if (inter) parts.push(inter);
      } catch(e){}
    });
    if (!parts.length) return null;
    var merged = parts[0];
    for (var i = 1; i < parts.length; i++) {
      try { merged = turf.union(merged, parts[i]); } catch(e){}
    }
    return merged;
  }

  function addStroke(pts, color) {
    if (!UKR || !RUS) return;
    var coords = pts.map(function(p){ return [p[1], p[0]]; });
    var first = coords[0], last = coords[coords.length-1];
    if (first[0] !== last[0] || first[1] !== last[1]) coords.push([first[0], first[1]]);
    var drawn = { type: 'Feature', geometry: { type: 'Polygon', coordinates: [coords] }, properties: {} };

    var unionAll = null;
    try { unionAll = turf.union(UKR, RUS); } catch(e){ unionAll = UKR; }
    var clipped = null;
    try { clipped = turf.intersect(drawn, unionAll); } catch(e){}
    if (!clipped) { showHint('За пределами'); return; }

    var partUkr = null, partRus = null;
    try { partUkr = turf.intersect(clipped, UKR); } catch(e){}
    try { partRus = turf.intersect(clipped, RUS); } catch(e){}

    var enemyColor = (color === '#dc2626') ? '#2563eb' : '#dc2626';
    var parts = [];
    var isUkrSide = (color === '#2563eb');

    if (isUkrSide) {
      if (partUkr) parts.push(partUkr);
      if (partRus) {
        var t = intersectWithColor(partRus, enemyColor);
        if (t) parts.push(t);
      }
    } else {
      if (partRus) parts.push(partRus);
      if (partUkr) {
        var t2 = intersectWithColor(partUkr, enemyColor);
        if (t2) parts.push(t2);
      }
    }

    if (!parts.length) {
      showHint('❌ Здесь нет врага');
      return;
    }

    var finalShape = parts[0];
    for (var i = 1; i < parts.length; i++) {
      try { finalShape = turf.union(finalShape, parts[i]); } catch(e){}
    }

    var captured = [];
    CITIES.forEach(function(c){
      var pt = turf.point([c.lon, c.lat]);
      try {
        if (turf.booleanPointInPolygon(pt, finalShape)) {
          if (cityOwners[c.name] !== color) {
            captured.push(c.name);
            cityOwners[c.name] = color;
          }
        }
      } catch(e){}
    });

    var newStrokes = [];
    strokes.forEach(function(s){
      if (s.color !== enemyColor) { newStrokes.push(s); return; }
      try {
        var diff = turf.difference(s.feature, finalShape);
        if (diff) newStrokes.push({ feature: diff, color: s.color });
      } catch(e){ newStrokes.push(s); }
    });
    strokes = newStrokes;

    var newHidden = [];
    hiddenStrokes.forEach(function(s){
      if (s.color !== enemyColor) { newHidden.push(s); return; }
      try {
        var diff = turf.difference(s.feature, finalShape);
        if (diff) newHidden.push({ feature: diff, color: s.color, hidden: true });
      } catch(e){ newHidden.push(s); }
    });
    hiddenStrokes = newHidden;

    strokes.push({ feature: finalShape, color: color });

    var sideName = color === '#dc2626' ? 'ВС РФ' : 'ВСУ';
    if (captured.length) {
      if (captured.length <= 3) {
        captured.forEach(function(n){ showToast('📍 ' + n + ' → ' + sideName, color); });
      } else {
        showToast('📍 ' + captured.length + ' НП → ' + sideName, color);
      }
    }

    redrawAll();
    saveAll();
  }

  function showToast(text, color) {
    var cont = document.getElementById('toasts');
    var el = document.createElement('div');
    el.className = 'toast ' + (color === '#dc2626' ? 'red' : 'blue');
    el.textContent = text;
    cont.appendChild(el);
    setTimeout(function(){ el.remove(); }, 3500);
    if (cont.children.length > 5) cont.removeChild(cont.firstChild);
  }

  function redrawAll() {
    fillLayers.forEach(function(l){ map.removeLayer(l); });
    fillLayers = [];

    var visible = strokes.filter(function(s){ return !s.hidden; });
    if (!visible.length) return;

    var byColor = {};
    visible.forEach(function(s){
      if (!byColor[s.color]) byColor[s.color] = [];
      byColor[s.color].push(s.feature);
    });

    Object.keys(byColor).forEach(function(color){
      var list = byColor[color];
      if (!list.length) return;
      var merged = list[0];
      for (var i = 1; i < list.length; i++) {
        try { merged = turf.union(merged, list[i]); } catch(e){}
      }
      var fl = L.geoJSON(merged, {
        style: {
          color: '#000000',
          weight: 2.5,
          opacity: 1,
          fillColor: color,
          fillOpacity: 0.75
        }
      }).addTo(map);
      fillLayers.push(fl);
    });
  }

  function undoLast(){
    if (!strokes.length) { showHint('Нет штрихов'); return; }
    strokes.pop();
    redrawAll();
    saveAll();
  }

  function showHint(t){
    var h = document.getElementById('hint');
    h.textContent = t;
    h.style.display = 'block';
    setTimeout(function(){ h.style.display = 'none'; }, 2000);
  }

  init();
})();
</script>
</body>
</html>
