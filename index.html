<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="google" content="notranslate">
<title>War Sandbox Ukraine</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{background:#000;color:#e2e8f0;overflow:hidden;height:100vh}
#map{position:absolute;inset:0;background:#000;z-index:1;touch-action:none}
.hidden{display:none!important}
#load{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;text-align:center;padding:20px;color:#e2e8f0}
#load .title{font-size:26px;font-weight:800;color:#facc15;margin-bottom:10px}
#load .sub{font-size:14px;color:#94a3b8;margin-bottom:20px}
#load .spinner{width:40px;height:40px;border:3px solid #1e293b;border-top-color:#facc15;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:14px}
#load .status{font-size:13px;color:#cbd5e1}
@keyframes spin{to{transform:rotate(360deg)}}
#panel{position:absolute;bottom:10px;left:8px;width:250px;background:rgba(0,0,0,.95);border:1px solid #1e293b;padding:10px;border-radius:12px;z-index:1000;font-size:11px;max-height:88vh;overflow-y:auto}
#panel .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#panel .header span{font-weight:600;color:#cbd5e1}
#panel .closeBtn{background:transparent;border:none;color:#94a3b8;font-size:18px;cursor:pointer;padding:0 5px;line-height:1}
#panel .row{display:flex;gap:6px;margin-bottom:8px}
#panel .brush{flex:1;padding:12px 4px;border-radius:8px;color:#fff;border:2px solid #333;font-size:11px;cursor:pointer;font-weight:600;text-align:center;background:#000}
#panel .brush.active.b-blue{background:#0ea5e9;border-color:#0ea5e9}
#panel .brush.active.b-red{background:#dc2626;border-color:#dc2626}
#panel .section{border-top:1px solid #1e293b;margin-top:8px;padding-top:8px}
#panel .sectionTitle{color:#94a3b8;font-size:10px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
#panel .mapBtn,#panel .langBtn{display:block;width:100%;padding:8px;margin-bottom:4px;background:#000;color:#fff;border:1px solid #333;border-radius:6px;font-size:11px;cursor:pointer;text-align:left;font-weight:600}
#panel .mapBtn.active,#panel .langBtn.active{background:#fff;color:#000;border-color:#fff}
#panel button.act{width:100%;padding:10px;margin-top:5px;background:#000;color:#fff;border:1px solid #333;border-radius:6px;font-size:11px;cursor:pointer;font-weight:600}
#panel button.act.active{background:#fff;color:#000;border-color:#fff}
#panel button.danger{background:#000;border-color:#7f1d1d;color:#fca5a5}
#panel .hintTxt{color:#94a3b8;text-align:center;margin-top:6px;font-size:10px}
#panel .sliderLabel{display:flex;justify-content:space-between;color:#cbd5e1;font-size:11px;margin-bottom:4px;margin-top:6px}
#panel .sliderLabel span:last-child{color:#facc15;font-weight:600}
#panel input[type=range]{width:100%;margin-bottom:4px}
#openBtn{position:absolute;bottom:10px;left:8px;width:44px;height:44px;background:rgba(0,0,0,.95);border:1px solid #1e293b;border-radius:50%;color:#e2e8f0;font-size:20px;cursor:pointer;z-index:1000;display:flex;align-items:center;justify-content:center}
#hint{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:rgba(250,204,21,.95);color:#111;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;z-index:2000;max-width:80vw;text-align:center;display:none}
</style>
</head>
<body>

<div id="map"></div>

<div id="load">
  <div class="title">⚔️ War Sandbox Ukraine</div>
  <div class="sub">Loading map...</div>
  <div class="spinner"></div>
  <div class="status" id="loadStatus">Loading borders (10m, ~30s)...</div>
</div>

<button id="openBtn" class="hidden">🎨</button>

<div id="panel" class="hidden">
  <div class="header">
    <span id="lblPanel">🎨 Panel</span>
    <button class="closeBtn" id="closeBtn">✕</button>
  </div>
  <div class="row">
    <button class="brush b-blue active" id="brushBlue"><span id="lblBlue">🔵 Blue</span></button>
    <button class="brush b-red" id="brushRed"><span id="lblRed">🔴 Red</span></button>
  </div>

  <div class="sliderLabel">
    <span id="lblGray">📏 Gray zone</span>
    <span id="grayVal">4 km</span>
  </div>
  <input type="range" id="graySlider" min="1" max="15" value="4">

  <div class="section">
    <div class="sectionTitle" id="lblMapTitle">🗺 Map</div>
    <button class="mapBtn active" data-map="osm">🗺 OpenStreetMap</button>
    <button class="mapBtn" data-map="topo" id="lblTopo">🌍 Topo</button>
    <button class="mapBtn" data-map="sat" id="lblSat">🛰 Satellite</button>
    <button class="mapBtn" data-map="hybrid" id="lblHybrid">🛰🏙 Satellite + labels</button>
  </div>

  <div class="section">
    <div class="sectionTitle" id="lblLangTitle">🌐 Language</div>
    <button class="langBtn active" data-lang="en">English</button>
    <button class="langBtn" data-lang="ru">Русский</button>
    <button class="langBtn" data-lang="uk">Українська</button>
    <button class="langBtn" data-lang="be">Беларуская</button>
    <button class="langBtn" data-lang="pl">Polski</button>
  </div>

  <button class="act" id="drawBtn"><span id="lblDraw">✏️ Enable brush</span></button>
  <button class="act danger" id="undoBtn"><span id="lblUndo">↩ Undo last</span></button>
  <button class="act danger" id="resetBtn"><span id="lblReset">🗑 Reset all</span></button>
  <div class="hintTxt" id="hintTxt">—</div>
</div>

<div id="hint"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script>
(function(){
  'use strict';

  var map;
  var baseLayer = null;
  var UKR = null, RUS = null;

  var COLOR_BLUE = '#0ea5e9';
  var COLOR_RED = '#dc2626';

  var currentColor = COLOR_BLUE;
  var grayZoneKm = 4;
  var drawMode = false;
  var currentPoints = [];
  var currentPreview = null;
  var startMarker = null;
  var LANG_KEY = 'war_sandbox_lang_v6';

  var currentLang = 'en';

  var strokes = [];

  var TRANSLATIONS = {
    en: { panel:'🎨 Panel', blue:'🔵 Blue', red:'🔴 Red', gray:'📏 Gray zone', map:'🗺 Map',
      topo:'🌍 Topo', sat:'🛰 Satellite', hybrid:'🛰🏙 Satellite + labels', lang:'🌐 Language',
      draw:'✏️ Enable brush', drawStop:'✖ Stop', undo:'↩ Undo last', reset:'🗑 Reset all',
      hintDraw:'Draw on the map', hintTooShort:'Too short', hintReset:'All territories cleared' },
    ru: { panel:'🎨 Панель', blue:'🔵 Голубой', red:'🔴 Красный', gray:'📏 Серая зона', map:'🗺 Карта',
      topo:'🌍 Топо', sat:'🛰 Спутник', hybrid:'🛰🏙 Спутник + названия', lang:'🌐 Язык',
      draw:'✏️ Включить кисть', drawStop:'✖ Стоп', undo:'↩ Убрать последний', reset:'🗑 Сбросить всё',
      hintDraw:'Рисуй на карте', hintTooShort:'Слишком коротко', hintReset:'Все территории сброшены' },
    uk: { panel:'🎨 Панель', blue:'🔵 Блакитний', red:'🔴 Червоний', gray:'📏 Сіра зона', map:'🗺 Карта',
      topo:'🌍 Топо', sat:'🛰 Супутник', hybrid:'🛰🏙 Супутник + назви', lang:'🌐 Мова',
      draw:'✏️ Увімкнути пензель', drawStop:'✖ Стоп', undo:'↩ Прибрати останній', reset:'🗑 Скинути все',
      hintDraw:'Малюй на карті', hintTooShort:'Занадто коротко', hintReset:'Усі території скинуті' },
    be: { panel:'🎨 Панэль', blue:'🔵 Блакітны', red:'🔴 Чырвоны', gray:'📏 Шэрая зона', map:'🗺 Карта',
      topo:'🌍 Топа', sat:'🛰 Спадарожнік', hybrid:'🛰🏙 Спадарожнік + назвы', lang:'🌐 Мова',
      draw:'✏️ Уключыць пэндзаль', drawStop:'✖ Стоп', undo:'↩ Прыбраць апошні', reset:'🗑 Скінуць усё',
      hintDraw:'Малюй на карце', hintTooShort:'Занадта каротка', hintReset:'Усе тэрыторыі скінуты' },
    pl: { panel:'🎨 Panel', blue:'🔵 Niebieski', red:'🔴 Czerwony', gray:'📏 Strefa szara', map:'🗺 Mapa',
      topo:'🌍 Topo', sat:'🛰 Satelita', hybrid:'🛰🏙 Satelita + nazwy', lang:'🌐 Język',
      draw:'✏️ Włącz pędzel', drawStop:'✖ Stop', undo:'↩ Cofnij ostatni', reset:'🗑 Zresetuj wszystko',
      hintDraw:'Rysuj na mapie', hintTooShort:'Za krótko', hintReset:'Wszystkie terytoria wyczyszczone' }
  };

  function t(key) {
    var lang = TRANSLATIONS[currentLang] || TRANSLATIONS.en;
    return lang[key] || TRANSLATIONS.en[key] || key;
  }

  function init() {
    map = L.map('map', { zoomControl: true, attributionControl: false }).setView([49, 32], 6);
    setMapLayer('osm');

    document.querySelectorAll('.mapBtn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.mapBtn').forEach(function(x) { x.classList.remove('active'); });
        btn.classList.add('active');
        setMapLayer(btn.getAttribute('data-map'));
      });
    });

    document.querySelectorAll('.langBtn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        currentLang = btn.getAttribute('data-lang');
        try { localStorage.setItem(LANG_KEY, currentLang); } catch(e) {}
        document.querySelectorAll('.langBtn').forEach(function(x) { x.classList.remove('active'); });
        btn.classList.add('active');
        applyTranslations();
      });
    });

    try {
      var savedLang = localStorage.getItem(LANG_KEY);
      if (savedLang && TRANSLATIONS[savedLang]) currentLang = savedLang;
    } catch(e) {}
    document.querySelectorAll('.langBtn').forEach(function(b) {
      b.classList.toggle('active', b.getAttribute('data-lang') === currentLang);
    });

    document.getElementById('brushBlue').addEventListener('click', function() {
      currentColor = COLOR_BLUE;
      this.classList.add('active');
      document.getElementById('brushRed').classList.remove('active');
    });
    document.getElementById('brushRed').addEventListener('click', function() {
      currentColor = COLOR_RED;
      this.classList.add('active');
      document.getElementById('brushBlue').classList.remove('active');
    });

    document.getElementById('graySlider').addEventListener('input', function() {
      grayZoneKm = parseInt(this.value);
      document.getElementById('grayVal').textContent = grayZoneKm + ' km';
      redrawAll();
    });

    document.getElementById('drawBtn').addEventListener('click', toggleDraw);
    document.getElementById('undoBtn').addEventListener('click', undoLast);
    document.getElementById('resetBtn').addEventListener('click', resetAll);
    document.getElementById('closeBtn').addEventListener('click', function() {
      document.getElementById('panel').classList.add('hidden');
      document.getElementById('openBtn').classList.remove('hidden');
    });
    document.getElementById('openBtn').addEventListener('click', function() {
      document.getElementById('panel').classList.remove('hidden');
      document.getElementById('openBtn').classList.add('hidden');
    });

    var container = map.getContainer();
    container.addEventListener('touchstart', handleStart, { passive: false });
    container.addEventListener('touchmove', handleMove, { passive: false });
    container.addEventListener('touchend', handleEnd, { passive: false });
    container.addEventListener('touchcancel', handleEnd, { passive: false });
    container.addEventListener('mousedown', handleStart);
    container.addEventListener('mousemove', handleMove);
    container.addEventListener('mouseup', handleEnd);
    container.addEventListener('mouseleave', handleEnd);

    applyTranslations();
    loadData();
  }

  function applyTranslations() {
    document.getElementById('lblPanel').textContent = t('panel');
    document.getElementById('lblBlue').textContent = t('blue');
    document.getElementById('lblRed').textContent = t('red');
    document.getElementById('lblGray').textContent = t('gray');
    document.getElementById('lblMapTitle').textContent = t('map');
    document.getElementById('lblTopo').textContent = t('topo');
    document.getElementById('lblSat').textContent = t('sat');
    document.getElementById('lblHybrid').textContent = t('hybrid');
    document.getElementById('lblLangTitle').textContent = t('lang');
    document.getElementById('lblDraw').textContent = drawMode ? t('drawStop') : t('draw');
    document.getElementById('lblUndo').textContent = t('undo');
    document.getElementById('lblReset').textContent = t('reset');
    document.getElementById('hintTxt').textContent = t('hintDraw');
    document.getElementById('grayVal').textContent = grayZoneKm + ' km';
  }

  function setMapLayer(type) {
    if (baseLayer) { map.removeLayer(baseLayer); baseLayer = null; }
    var url, opts = {};
    if (type === 'osm') {
      url = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
      opts.maxZoom = 19;
    } else if (type === 'topo') {
      url = 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png';
      opts.maxZoom = 17; opts.subdomains = 'abc';
    } else if (type === 'sat') {
      url = 'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}';
      opts.maxZoom = 20; opts.subdomains = ['mt0','mt1','mt2','mt3'];
    } else if (type === 'hybrid') {
      url = 'https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}';
      opts.maxZoom = 20; opts.subdomains = ['mt0','mt1','mt2','mt3'];
    }
    baseLayer = L.tileLayer(url, opts).addTo(map);
  }

  function loadData() {
    setStatus('Loading borders (10m, ~30s)...');
    fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_admin_0_countries.geojson')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        setStatus('Building map...');
        var ukr = data.features.find(function(f) {
          var c = f.properties.ADM0_A3 || f.properties.adm0_a3 || '';
          return c === 'UKR';
        });
        var rus_full = data.features.find(function(f) {
          var c = f.properties.ADM0_A3 || f.properties.adm0_a3 || '';
          return c === 'RUS';
        });
        if (!ukr || !rus_full) { setStatus('Not found'); return; }

        setStatus('Clipping Russia...');
        var clipBox = turf.bboxPolygon([19, 41, 60, 82]);
        var rus = null;
        try { rus = turf.intersect(rus_full, clipBox); } catch(e) { rus = rus_full; }
        if (!rus) rus = rus_full;

        UKR = ukr;
        RUS = rus;

        strokes = [
          { feature: UKR, color: COLOR_BLUE, radius: grayZoneKm },
          { feature: RUS, color: COLOR_RED, radius: grayZoneKm }
        ];
        redrawAll();

        try { map.fitBounds(L.geoJSON(UKR).getBounds(), { padding: [20, 20] }); } catch(e) {}

        document.getElementById('load').style.display = 'none';
        document.getElementById('panel').classList.remove('hidden');
      })
      .catch(function(e) { setStatus('Error: ' + e.message); });
  }

  function setStatus(txt) {
    var el = document.getElementById('loadStatus');
    if (el) el.textContent = txt;
  }

  function toggleDraw() {
    drawMode = !drawMode;
    var btn = document.getElementById('drawBtn');
    var lbl = document.getElementById('lblDraw');
    if (drawMode) {
      lbl.textContent = t('drawStop');
      btn.classList.add('active');
      map.dragging.disable();
    } else {
      lbl.textContent = t('draw');
      btn.classList.remove('active');
      map.dragging.enable();
      cancelStroke();
    }
  }

  function cancelStroke() {
    if (currentPreview) { map.removeLayer(currentPreview); currentPreview = null; }
    if (startMarker) { map.removeLayer(startMarker); startMarker = null; }
    currentPoints = [];
  }

  function getLatLng(e) {
    var t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
    return map.mouseEventToLatLng(t);
  }

  function handleStart(e) {
    if (!drawMode) return;
    if (e.touches && e.touches.length > 1) return;
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    var ll = getLatLng(e);
    currentPoints = [ll];
    startMarker = L.marker(ll, {
      icon: L.divIcon({
        className: '',
        html: '<div style="font-size:24px;line-height:1;filter:drop-shadow(0 2px 4px #000)">✏️</div>',
        iconSize: [24, 24], iconAnchor: [12, 12]
      }),
      interactive: false
    }).addTo(map);
    currentPreview = L.polygon(currentPoints, {
      color: '#facc15', weight: 3, opacity: 0.9,
      fillColor: currentColor, fillOpacity: 0.2, dashArray: '5,5'
    }).addTo(map);
  }

  var lastMoveTime = 0;
  function handleMove(e) {
    if (!drawMode || !currentPreview) return;
    e.preventDefault();
    var now = Date.now();
    if (now - lastMoveTime < 100) return;
    lastMoveTime = now;
    var ll = getLatLng(e);
    var last = currentPoints[currentPoints.length - 1];
    if (last && Math.abs(last.lat - ll.lat) < 0.0005 && Math.abs(last.lng - ll.lng) < 0.0005) return;
    currentPoints.push(ll);
    currentPreview.setLatLngs(currentPoints);
  }

  function handleEnd(e) {
    if (!drawMode || !currentPreview) return;
    e.preventDefault();
    var pts = currentPoints.slice();
    cancelStroke();
    if (pts.length < 3) { showHint(t('hintTooShort')); return; }
    var arr = pts.map(function(ll) { return [ll.lat, ll.lng]; });
    addStroke(arr, currentColor);
  }

  function addStroke(pts, color) {
    var coords = pts.map(function(p) { return [p[1], p[0]]; });
    var first = coords[0], last = coords[coords.length - 1];
    if (first[0] !== last[0] || first[1] !== last[1]) coords.push([first[0], first[1]]);

    var drawn = { type: 'Feature', geometry: { type: 'Polygon', coordinates: [coords] }, properties: {} };

    var unionAll = null;
    try {
      unionAll = turf.union(turf.featureCollection([UKR, RUS]));
    } catch(e) {
      console.warn('Union UKR+RUS failed:', e);
      unionAll = UKR;
    }

    var clipped = null;
    try {
      clipped = turf.intersect(drawn, unionAll);
    } catch(e) {
      console.warn('Intersect failed:', e);
    }
    if (!clipped) { showHint('Outside'); return; }

    strokes.push({ feature: clipped, color: color, radius: grayZoneKm });
    redrawAll();
  }

  function redrawAll() {
    if (window._layers) {
      window._layers.forEach(function(l) { if (map.hasLayer(l)) map.removeLayer(l); });
    }
    window._layers = [];

    if (!strokes.length) return;

    var byColor = {};
    strokes.forEach(function(s) {
      if (!byColor[s.color]) byColor[s.color] = [];
      byColor[s.color].push(s.feature);
    });

    var mergedByColor = {};
    Object.keys(byColor).forEach(function(color) {
      var list = byColor[color];
      var merged = list[0];
      for (var i = 1; i < list.length; i++) {
        try {
          merged = turf.union(turf.featureCollection([merged, list[i]]));
        } catch(e) {
          console.warn('Merge ' + color + ' failed at ' + i + ':', e);
        }
      }
      mergedByColor[color] = merged;
    });

    if (mergedByColor[COLOR_BLUE] && mergedByColor[COLOR_RED]) {
      var inter = null;
      try {
        inter = turf.intersect(mergedByColor[COLOR_BLUE], mergedByColor[COLOR_RED]);
      } catch(e) {}
      if (inter) {
        var lastColor = strokes[strokes.length - 1].color;
        var loserColor = (lastColor === COLOR_BLUE) ? COLOR_RED : COLOR_BLUE;
        try {
          var loserDiff = turf.difference(mergedByColor[loserColor], inter);
          if (loserDiff) mergedByColor[loserColor] = loserDiff;
        } catch(e) {
          console.warn('Difference loser failed:', e);
        }
      }
    }

    var grayParts = [];
    Object.keys(mergedByColor).forEach(function(color) {
      var shape = mergedByColor[color];
      try {
        var buf = turf.buffer(shape, grayZoneKm, { units: 'kilometers' });
        var ring = turf.difference(buf, shape);
        if (ring) grayParts.push(ring);
      } catch(e) {
        console.warn('Buffer failed for ' + color + ':', e);
      }
    });

    if (grayParts.length) {
      var grayMerged = grayParts[0];
      for (var j = 1; j < grayParts.length; j++) {
        try {
          grayMerged = turf.union(turf.featureCollection([grayMerged, grayParts[j]]));
        } catch(e) {}
      }
      Object.keys(mergedByColor).forEach(function(color) {
        try {
          var diff = turf.difference(grayMerged, mergedByColor[color]);
          if (diff) grayMerged = diff;
        } catch(e) {}
      });

      var gl = L.geoJSON(grayMerged, {
        style: { color: '#9ca3af', weight: 1, fillColor: '#9ca3af', fillOpacity: 0.4, dashArray: '4,4' },
        interactive: false
      }).addTo(map);
      window._layers.push(gl);
    }

    Object.keys(mergedByColor).forEach(function(color) {
      var fl = L.geoJSON(mergedByColor[color], {
        style: { color: color, weight: 0, fillColor: color, fillOpacity: 0.5 }
      }).addTo(map);
      window._layers.push(fl);
    });
  }

  function undoLast() {
    if (strokes.length <= 2) return;
    strokes.pop();
    redrawAll();
  }

  function resetAll() {
    if (!UKR || !RUS) return;
    strokes = [
      { feature: UKR, color: COLOR_BLUE, radius: grayZoneKm },
      { feature: RUS, color: COLOR_RED, radius: grayZoneKm }
    ];
    redrawAll();
    showHint(t('hintReset'));
  }

  function showHint(txt) {
    var h = document.getElementById('hint');
    h.textContent = txt;
    h.style.display = 'block';
    setTimeout(function() { h.style.display = 'none'; }, 2000);
  }

  init();
})();
</script>
</body>
</html>
