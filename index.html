<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Фронт</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{background:#0f172a;color:#e2e8f0;overflow:hidden;height:100vh}
#map{position:absolute;inset:0;background:#0f172a;z-index:1;touch-action:none}
.hidden{display:none!important}
#load{position:fixed;inset:0;z-index:9999;background:#0f172a;display:flex;align-items:center;justify-content:center;font-size:16px;text-align:center;padding:20px;color:#e2e8f0}

#panel{position:absolute;bottom:10px;left:8px;width:240px;background:rgba(15,23,42,.96);border:1px solid #334155;padding:10px;border-radius:12px;z-index:1000;font-size:11px;max-height:80vh;overflow-y:auto}
#panel .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#panel .header span{font-weight:600;color:#cbd5e1}
#panel .closeBtn{background:transparent;border:none;color:#94a3b8;font-size:18px;cursor:pointer;padding:0 5px;line-height:1}
#panel .row{display:flex;gap:6px;margin-bottom:8px}
#panel .brush{flex:1;padding:12px 4px;border-radius:8px;color:#fff;border:2px solid #475569;font-size:11px;cursor:pointer;font-weight:600;text-align:center;transition:all .15s}
#panel .brush.active{border-color:#facc15;transform:scale(1.03)}
#panel .brush.b-red{background:#dc2626}
#panel .brush.b-blue{background:#2563eb}

#panel .section{border-top:1px solid #334155;margin-top:8px;padding-top:8px}
#panel .sectionTitle{color:#94a3b8;font-size:10px;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;font-weight:600}

#panel .mapBtn{display:block;width:100%;padding:8px;margin-bottom:4px;background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;font-size:11px;cursor:pointer;text-align:left;font-weight:600}
#panel .mapBtn.active{background:#334155;border-color:#facc15;color:#fff}

#panel button.act{width:100%;padding:10px;margin-top:5px;background:#475569;color:#fff;border:none;border-radius:6px;font-size:11px;cursor:pointer;font-weight:600}
#panel button.act.active{background:#facc15;color:#111}
#panel button.danger{background:#7f1d1d}
#panel .hintTxt{color:#94a3b8;text-align:center;margin-top:6px;font-size:10px;line-height:1.4}

#openBtn{position:absolute;bottom:10px;left:8px;width:44px;height:44px;background:rgba(15,23,42,.96);border:1px solid #334155;border-radius:50%;color:#e2e8f0;font-size:20px;cursor:pointer;z-index:1000;display:flex;align-items:center;justify-content:center}

#legend{position:absolute;top:10px;left:8px;background:rgba(15,23,42,.85);border:1px solid #334155;padding:8px;border-radius:10px;z-index:1000;font-size:11px;line-height:1.8}
#legend .item{display:flex;align-items:center;gap:6px}
#legend .sw{width:14px;height:14px;border-radius:3px;border:1px solid #475569}

#hint{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(250,204,21,.95);color:#111;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;z-index:2000;max-width:80vw;text-align:center;display:none}
</style>
</head>
<body>

<div id="map"></div>
<div id="load">Загрузка карты...</div>

<div id="legend" class="hidden">
  <div class="item"><div class="sw" style="background:#dc2626"></div>Красное</div>
  <div class="item"><div class="sw" style="background:#2563eb"></div>Синее</div>
</div>

<button id="openBtn" class="hidden">🎨</button>

<div id="panel" class="hidden">
  <div class="header">
    <span>🎨 Панель</span>
    <button class="closeBtn" id="closeBtn">✕</button>
  </div>
  <div class="row">
    <button class="brush b-red active" data-color="#dc2626">🔴 Красный</button>
    <button class="brush b-blue" data-color="#2563eb">🔵 Синий</button>
  </div>

  <div class="section">
    <div class="sectionTitle">🗺 Карта</div>
    <button class="mapBtn active" data-map="voyager">🗺 Google-стиль (зелёная)</button>
    <button class="mapBtn" data-map="osm">🗺 OpenStreetMap</button>
    <button class="mapBtn" data-map="topo">🌍 Топо (рельеф)</button>
    <button class="mapBtn" data-map="dark">🌑 Тёмная</button>
  </div>

  <button class="act" id="drawBtn">✏️ Включить кисть</button>
  <button class="act danger" id="undoBtn">↩ Убрать последний</button>
  <button class="act danger" id="clearBtn">🗑 Убрать всё</button>
  <div class="hintTxt" id="hintTxt">Красный по УКР, по РФ только по синему</div>
</div>

<div id="hint"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script>
(function(){
  'use strict';

  var map;
  var currentColor = '#dc2626';
  var drawMode = false;
  var currentPoints = [];
  var currentPreview = null;
  var startMarker = null;
  var STORAGE_KEY = 'war_sandbox_v20';

  var UKR = null, RUS = null;

  var strokes = [];
  var fillLayers = [];
  var baseLayer = null;

  function init(){
    map = L.map('map', {zoomControl:true, attributionControl:false}).setView([50, 34], 6);

    setMapLayer('voyager');

    var brushes = document.querySelectorAll('.brush');
    brushes.forEach(function(b){
      b.addEventListener('click', function(){
        brushes.forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active');
        currentColor = b.getAttribute('data-color');
      });
    });

    document.querySelectorAll('.mapBtn').forEach(function(btn){
      btn.addEventListener('click', function(){
        document.querySelectorAll('.mapBtn').forEach(function(x){ x.classList.remove('active'); });
        btn.classList.add('active');
        setMapLayer(btn.getAttribute('data-map'));
      });
    });

    document.getElementById('drawBtn').addEventListener('click', toggleDraw);
    document.getElementById('undoBtn').addEventListener('click', undoLast);
    document.getElementById('clearBtn').addEventListener('click', clearAll);
    document.getElementById('closeBtn').addEventListener('click', function(){
      document.getElementById('panel').classList.add('hidden');
      document.getElementById('openBtn').classList.remove('hidden');
    });
    document.getElementById('openBtn').addEventListener('click', function(){
      document.getElementById('panel').classList.remove('hidden');
      document.getElementById('openBtn').classList.add('hidden');
    });

    var container = map.getContainer();
    container.addEventListener('touchstart', handleStart, {passive:false});
    container.addEventListener('touchmove', handleMove, {passive:false});
    container.addEventListener('touchend', handleEnd, {passive:false});
    container.addEventListener('touchcancel', handleEnd, {passive:false});
    container.addEventListener('mousedown', handleStart);
    container.addEventListener('mousemove', handleMove);
    container.addEventListener('mouseup', handleEnd);
    container.addEventListener('mouseleave', handleEnd);

    loadData();
  }

  // ===== ПОДЛОЖКИ =====
  function setMapLayer(type) {
    if (baseLayer) { map.removeLayer(baseLayer); baseLayer = null; }

    var url, opts = {};
    if (type === 'voyager') {
      url = 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
      opts.maxZoom = 20; opts.subdomains = 'abcd';
    } else if (type === 'osm') {
      url = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
      opts.maxZoom = 19;
    } else if (type === 'topo') {
      url = 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png';
      opts.maxZoom = 17; opts.subdomains = 'abc';
    } else if (type === 'dark') {
      url = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
      opts.maxZoom = 20; opts.subdomains = 'abcd';
    }

    baseLayer = L.tileLayer(url, opts).addTo(map);
    fillLayers.forEach(function(l){ if (map.hasLayer(l)) l.bringToFront(); });
  }

  function saveAll() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(strokes)); } catch(e){}
  }
  function loadAll() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (Array.isArray(data)) strokes = data;
    } catch(e){}
  }

  // ===== ЗАГРУЗКА ГРАНИЦ =====
  function loadData(){
    document.getElementById('load').textContent = 'Загрузка границ...';

    // Параллельно грузим: точную Украину (10m) и грубую РФ (110m)
    var pUkr = fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_admin_0_countries.geojson')
      .then(function(r){ return r.json(); })
      .then(function(data){
        return data.features.find(function(f){
          var code = f.properties.ADM0_A3 || f.properties.adm0_a3 || '';
          return code === 'UKR';
        });
      });

    var pRus = fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
      .then(function(r){ return r.json(); })
      .then(function(data){
        return data.features.find(function(f){
          var code = f.properties.ADM0_A3 || f.properties.adm0_a3 || '';
          return code === 'RUS';
        });
      });

    Promise.all([pUkr, pRus])
      .then(function(res){
        UKR = res[0];
        RUS = res[1];
        if (!UKR || !RUS) { document.getElementById('load').textContent = 'Не нашёл страны'; return; }

        // РФ — грубая, чёрная тонкая
        L.geoJSON(RUS, {style:{color:'#000000',weight:2,fillOpacity:0,opacity:0.6}, interactive:false}).addTo(map);

        // Украина — детальная, чёрная жирнее
        L.geoJSON(UKR, {style:{color:'#000000',weight:2.5,fillOpacity:0,opacity:0.9}, interactive:false}).addTo(map);

        try { map.fitBounds(L.geoJSON(UKR).getBounds(), {padding:[20,20]}); } catch(e){}

        loadAll();
        redrawAll();
        document.getElementById('load').style.display = 'none';
        document.getElementById('legend').classList.remove('hidden');
        document.getElementById('panel').classList.remove('hidden');
      })
      .catch(function(e){ document.getElementById('load').textContent = 'Ошибка: ' + e.message; });
  }

  function toggleDraw(){
    drawMode = !drawMode;
    var btn = document.getElementById('drawBtn');
    if (drawMode) {
      btn.textContent = '✖ Стоп';
      btn.classList.add('active');
      map.dragging.disable();
    } else {
      btn.textContent = '✏️ Включить кисть';
      btn.classList.remove('active');
      map.dragging.enable();
      cancelStroke();
    }
  }

  function cancelStroke() {
    if (currentPreview) { map.removeLayer(currentPreview); currentPreview = null; }
    if (startMarker) { map.removeLayer(startMarker); startMarker = null; }
    currentPoints = [];
  }

  function getLatLng(e) {
    var t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
    return map.mouseEventToLatLng(t);
  }

  function handleStart(e){
    if (!drawMode) return;
    if (e.touches && e.touches.length > 1) return;
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    var ll = getLatLng(e);
    currentPoints = [ll];

    startMarker = L.marker(ll, {
      icon: L.divIcon({
        className: '',
        html: '<div style="font-size:24px;line-height:1;filter:drop-shadow(0 2px 4px #000)">✏️</div>',
        iconSize: [24,24], iconAnchor: [12,12]
      }),
      interactive: false
    }).addTo(map);

    currentPreview = L.polygon(currentPoints, {
      color: '#facc15', weight: 3, opacity: 0.9,
      fillColor: currentColor, fillOpacity: 0.2,
      dashArray: '5,5'
    }).addTo(map);
  }

  function handleMove(e){
    if (!drawMode || !currentPreview) return;
    e.preventDefault();
    var ll = getLatLng(e);
    currentPoints.push(ll);
    currentPreview.setLatLngs(currentPoints);
  }

  function handleEnd(e){
    if (!drawMode || !currentPreview) return;
    e.preventDefault();
    var pts = currentPoints.slice();
    cancelStroke();
    if (pts.length < 3) { showHint('Слишком коротко'); return; }
    var arr = pts.map(function(ll){ return [ll.lat, ll.lng]; });
    addStroke(arr, currentColor);
  }

  function intersectWithColor(feature, targetColor) {
    var parts = [];
    strokes.forEach(function(s){
      if (s.color !== targetColor) return;
      try {
        var inter = turf.intersect(feature, s.feature);
        if (inter) parts.push(inter);
      } catch(e){}
    });
    if (!parts.length) return null;
    var merged = parts[0];
    for (var i = 1; i < parts.length; i++) {
      try { merged = turf.union(merged, parts[i]); } catch(e){}
    }
    return merged;
  }

  function detectCountry(feature) {
    try {
      var iUkr = turf.intersect(feature, UKR);
      var iRus = turf.intersect(feature, RUS);
      var aUkr = iUkr ? turf.area(iUkr) : 0;
      var aRus = iRus ? turf.area(iRus) : 0;
      if (aUkr > aRus) return 'UKR';
      if (aRus > aUkr) return 'RUS';
    } catch(e){}
    return null;
  }

  function addStroke(pts, color) {
    if (!UKR || !RUS) return;

    var coords = pts.map(function(p){ return [p[1], p[0]]; });
    var first = coords[0], last = coords[coords.length-1];
    if (first[0] !== last[0] || first[1] !== last[1]) coords.push([first[0], first[1]]);

    var drawn = {
      type: 'Feature',
      geometry: { type: 'Polygon', coordinates: [coords] },
      properties: {}
    };

    var country = detectCountry(drawn);
    if (!country) { showHint('За пределами карты'); return; }

    var countryFeature = country === 'UKR' ? UKR : RUS;
    var clipped = null;
    try { clipped = turf.intersect(drawn, countryFeature); } catch(e){}
    if (!clipped) { showHint('За пределами карты'); return; }

    var oppositeColor = (color === '#dc2626') ? '#2563eb' : '#dc2626';

    var needIntersection = false;
    if (color === '#dc2626' && country === 'RUS') needIntersection = true;
    if (color === '#2563eb' && country === 'UKR') needIntersection = true;

    if (needIntersection) {
      var target = intersectWithColor(clipped, oppositeColor);
      if (!target) {
        showHint('❌ Здесь нет ' + (oppositeColor === '#dc2626' ? 'красного' : 'синего'));
        return;
      }
      clipped = target;
    }

    try {
      var reClipped = turf.intersect(clipped, countryFeature);
      if (reClipped) clipped = reClipped;
    } catch(e){}

    var newStrokes = [];
    strokes.forEach(function(s){
      if (s.color !== oppositeColor) { newStrokes.push(s); return; }
      try {
        var diff = turf.difference(s.feature, clipped);
        if (diff) newStrokes.push({ feature: diff, color: s.color });
      } catch(e){ newStrokes.push(s); }
    });
    strokes = newStrokes;

    strokes.push({ feature: clipped, color: color });

    redrawAll();
    saveAll();
  }

  // ===== ЧЁТКАЯ ГРАНИЦА ПЯТЕН =====
  function redrawAll() {
    fillLayers.forEach(function(l){ map.removeLayer(l); });
    fillLayers = [];

    if (!strokes.length) return;

    var byColor = { '#dc2626': [], '#2563eb': [] };
    strokes.forEach(function(s){
      if (!byColor[s.color]) byColor[s.color] = [];
      byColor[s.color].push(s.feature);
    });

    Object.keys(byColor).forEach(function(color){
      var list = byColor[color];
      if (!list.length) return;
      var merged = list[0];
      for (var i = 1; i < list.length; i++) {
        try { merged = turf.union(merged, list[i]); } catch(e){}
      }
      var fl = L.geoJSON(merged, {
        style: {
          color: '#000000',      // ЧЁРНАЯ обводка (как у госграниц)
          weight: 2.5,           // потолще
          opacity: 1,            // яркая
          fillColor: color,      // заливка своим цветом
          fillOpacity: 0.75
        }
      }).addTo(map);
      fillLayers.push(fl);
    });
  }

  function undoLast(){
    if (!strokes.length) { showHint('Нет штрихов'); return; }
    strokes.pop();
    redrawAll();
    saveAll();
  }

  function clearAll(){
    if (!strokes.length) return;
    if (!confirm('Убрать всё?')) return;
    strokes = [];
    redrawAll();
    saveAll();
  }

  function showHint(t){
    var h = document.getElementById('hint');
    h.textContent = t;
    h.style.display = 'block';
    setTimeout(function(){ h.style.display = 'none'; }, 2000);
  }

  init();
})();
</script>
</body>
</html>
