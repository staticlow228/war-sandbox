<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>War Sandbox — Фронт</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{background:#0f172a;color:#e2e8f0;overflow:hidden;height:100vh}
#map{position:absolute;inset:0;background:#1a1a1a;z-index:1}
.hidden{display:none!important}

#menu{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(135deg,#0f172a,#1e293b);padding:20px}
#menu h1{font-size:22px;text-align:center;margin-bottom:8px}
#menu p{color:#94a3b8;font-size:13px;text-align:center;margin-bottom:14px;max-width:300px}
#menu button{width:100%;max-width:280px;padding:18px;font-size:16px;font-weight:600;border-radius:12px;cursor:pointer;border:2px solid;background:#1e293b;color:#fff}
#menu .b-ua{border-color:#3b82f6;background:#1e3a8a}
#menu .b-ru{border-color:#ef4444;background:#7f1d1d}

#loading{position:fixed;inset:0;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(15,23,42,.98);padding:20px;text-align:center}
#loading .big{font-size:40px}
#loadingText{font-size:14px}

#game{position:absolute;inset:0}

#topbar{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.95);border:1px solid #334155;padding:8px 14px;border-radius:10px;display:flex;gap:10px;align-items:center;z-index:1000;font-size:12px;white-space:nowrap}
#topbar button{background:#334155;color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer}

#frontTool{position:absolute;bottom:10px;left:8px;width:230px;background:rgba(15,23,42,.96);border:1px solid #334155;padding:12px;border-radius:12px;z-index:1000;font-size:12px}
#frontTool .label{color:#cbd5e1;margin-bottom:8px;display:flex;justify-content:space-between;font-weight:600}
#frontTool .label span:last-child{color:#facc15}
#frontTool input[type=range]{width:100%;margin:8px 0}
#frontTool button{width:100%;padding:10px;margin-top:6px;background:#334155;color:#fff;border:none;border-radius:8px;font-size:12px;cursor:pointer;font-weight:600}
#frontTool button:active{background:#475569}
#frontTool button.active{background:#facc15;color:#111}
#frontTool button.danger{background:#7f1d1d}
#frontTool button.danger:active{background:#991b1b}

#log{position:absolute;bottom:10px;right:8px;width:180px;max-height:150px;overflow-y:auto;background:rgba(15,23,42,.95);border:1px solid #334155;padding:8px;border-radius:10px;font-size:11px;z-index:1000}
#logTitle{font-weight:600;margin-bottom:5px;font-size:12px}
#logList div{padding:3px 0;border-bottom:1px solid #1e293b;color:#cbd5e1}

#hint{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(250,204,21,.95);color:#111;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;z-index:2000;max-width:80vw;text-align:center}
.leaflet-container{cursor:crosshair}
.leaflet-container.drawing{cursor:crosshair!important}
.leaflet-container.drawing .leaflet-interactive{pointer-events:none}
</style>
</head>
<body>

<div id="menu">
  <h1>⚔️ Военная песочница</h1>
  <p>Выбери сторону. Рисуй фронт кистью — вокруг появится серая зона.</p>
  <button class="b-ua" id="btnPickUA">🇺🇦 Играть за Украину</button>
  <button class="b-ru" id="btnPickRU">🇷🇺 Играть за Россию</button>
</div>

<div id="loading" class="hidden">
  <div class="big">⏳</div>
  <div id="loadingText">Загрузка карты...</div>
</div>

<div id="game" class="hidden">
  <div id="map"></div>

  <div id="topbar">
    <span id="sideLabel">—</span>
    <button onclick="location.reload()">↩ Меню</button>
  </div>

  <div id="frontTool">
    <div class="label">
      <span>📏 Радиус зоны</span>
      <span id="radiusVal">5 км</span>
    </div>
    <input type="range" id="radiusInput" min="1" max="10" value="5" step="1">

    <button id="drawBtn">✏️ Начать рисовать</button>
    <button id="undoBtn" class="danger">↩ Убрать последний</button>
    <button id="clearBtn" class="danger">🗑 Убрать все фронты</button>
  </div>

  <div id="log">
    <div id="logTitle">📜 События</div>
    <div id="logList"></div>
  </div>

  <div id="hint" class="hidden"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script>
(function() {
  'use strict';

  var map, playerSide = 'ua';
  var radiusKm = 5;
  var drawMode = false;
  var currentPoints = [];
  var currentPreview = null;
  var fronts = []; // {line, buffer, points}

  var SIDE_COLORS = { ua: '#3b82f6', ru: '#ef4444' };
  var SIDE_NAMES = { ua: 'Украина', ru: 'Россия' };

  // ---- Меню ----
  function pickSide(side) {
    playerSide = side;
    document.getElementById('menu').style.display = 'none';
    document.getElementById('game').classList.remove('hidden');
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('sideLabel').textContent = 'Ты: ' + SIDE_NAMES[side];
    initMap();
  }

  document.getElementById('btnPickUA').addEventListener('click', function(){ pickSide('ua'); });
  document.getElementById('btnPickRU').addEventListener('click', function(){ pickSide('ru'); });

  // ---- Карта ----
  function initMap() {
    map = L.map('map', {
      zoomControl: false,
      attributionControl: false,
      preferCanvas: true
    }).setView([49, 32], 6);

    L.control.zoom({ position: 'topright' }).addTo(map);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 12 }).addTo(map);

    // Заглушка — данные не грузим (нет закраски областей)
    setTimeout(function() {
      document.getElementById('loading').classList.add('hidden');
      log('✅ Карта готова');
      log('Жми ✏️ Начать рисовать');
      showHint('Тапни ✏️ Начать рисовать, потом веди пальцем по карте');
    }, 500);

    // ---- Ползунок радиуса ----
    var slider = document.getElementById('radiusInput');
    slider.addEventListener('input', function() {
      radiusKm = parseInt(slider.value);
      document.getElementById('radiusVal').textContent = radiusKm + ' км';
      // Обновить все существующие буферы
      fronts.forEach(function(f) { rebuildBuffer(f); });
    });

    // ---- Кнопки ----
    document.getElementById('drawBtn').addEventListener('click', toggleDraw);
    document.getElementById('undoBtn').addEventListener('click', undoLast);
    document.getElementById('clearBtn').addEventListener('click', clearAll);

    // ---- Рисование ----
    map.on('mousedown', onDrawStart);
    map.on('mousemove', onDrawMove);
    map.on('mouseup', onDrawEnd);
    // Touch
    map.on('touchstart', onDrawStart);
    map.on('touchmove', onDrawMove);
    map.on('touchend', onDrawEnd);
  }

  // ---- UI ----
  function showHint(text) {
    var h = document.getElementById('hint');
    h.textContent = text;
    h.classList.remove('hidden');
    setTimeout(function(){ h.classList.add('hidden'); }, 3500);
  }

  function log(text) {
    var list = document.getElementById('logList');
    var el = document.createElement('div');
    var t = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    el.textContent = '[' + t + '] ' + text;
    list.insertBefore(el, list.firstChild);
    if (list.children.length > 40) list.removeChild(list.lastChild);
  }

  // ---- Режим рисования ----
  function toggleDraw() {
    drawMode = !drawMode;
    var btn = document.getElementById('drawBtn');
    var container = map.getContainer();
    if (drawMode) {
      btn.textContent = '✖ Стоп';
      btn.classList.add('active');
      container.classList.add('drawing');
      map.dragging.disable();
      log('✏️ Рисование: веди пальцем по карте');
      showHint('Веди пальцем — рисуй линию фронта');
    } else {
      btn.textContent = '✏️ Начать рисовать';
      btn.classList.remove('active');
      container.classList.remove('drawing');
      map.dragging.enable();
      cancelPreview();
      log('✏️ Рисование выключено');
    }
  }

  function cancelPreview() {
    if (currentPreview) {
      map.removeLayer(currentPreview);
      currentPreview = null;
    }
    currentPoints = [];
  }

  // ---- Обработчики рисования ----
  function onDrawStart(e) {
    if (!drawMode) return;
    if (e.originalEvent && e.originalEvent.touches && e.originalEvent.touches.length > 1) return;
    currentPoints = [e.latlng];
    currentPreview = L.polyline(currentPoints, {
      color: '#facc15', weight: 4, opacity: 1
    }).addTo(map);
  }

  function onDrawMove(e) {
    if (!drawMode || !currentPreview) return;
    currentPoints.push(e.latlng);
    currentPreview.setLatLngs(currentPoints);
    // Не даём карте двигаться
    if (e.originalEvent && e.originalEvent.preventDefault) {
      e.originalEvent.preventDefault();
    }
  }

  function onDrawEnd() {
    if (!drawMode || !currentPreview) return;
    if (currentPoints.length < 2) {
      cancelPreview();
      return;
    }
    // Убрать превью
    map.removeLayer(currentPreview);
    currentPreview = null;

    // Создать финальный фронт
    var points = currentPoints.slice();
    currentPoints = [];
    createFront(points);
  }

  // ---- Создание фронта ----
  function createFront(points) {
    var line = L.polyline(points, {
      color: '#facc15',
      weight: 4,
      opacity: 1
    }).addTo(map);

    var front = { line: line, buffer: null, points: points };
    fronts.push(front);
    rebuildBuffer(front);

    log('✏️ Фронт нарисован (' + points.length + ' точек, радиус ' + radiusKm + ' км)');
  }

  function rebuildBuffer(front) {
    // Убрать старый буфер
    if (front.buffer) {
      map.removeLayer(front.buffer);
      front.buffer = null;
    }

    try {
      var lineGeoJSON = front.line.toGeoJSON();
      // Буфер шириной radiusKm
      var buffered = turf.buffer(lineGeoJSON, radiusKm, { units: 'kilometers' });
      if (!buffered) return;

      front.buffer = L.geoJSON(buffered, {
        style: {
          color: '#9ca3af',
          weight: 1,
          fillColor: '#9ca3af',
          fillOpacity: 0.3,
          dashArray: '4,4'
        },
        interactive: false
      }).addTo(map);
    } catch (e) {
      console.error('Buffer error:', e);
    }
  }

  function undoLast() {
    if (!fronts.length) {
      log('Нет фронтов для удаления');
      return;
    }
    var last = fronts.pop();
    if (last.line) map.removeLayer(last.line);
    if (last.buffer) map.removeLayer(last.buffer);
    log('↩ Последний фронт убран');
  }

  function clearAll() {
    fronts.forEach(function(f) {
      if (f.line) map.removeLayer(f.line);
      if (f.buffer) map.removeLayer(f.buffer);
    });
    fronts = [];
    log('🗑 Все фронты убраны');
  }

})();
</script>
</body>
</html>
