<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Фронт</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{background:#0f172a;color:#e2e8f0;overflow:hidden;height:100vh}
#map{position:absolute;inset:0;background:#0f172a;z-index:1;touch-action:none}
.hidden{display:none!important}
#load{position:fixed;inset:0;z-index:9999;background:#0f172a;display:flex;align-items:center;justify-content:center;font-size:16px;text-align:center;padding:20px;color:#e2e8f0}

#panel{position:absolute;bottom:10px;left:8px;width:230px;background:rgba(15,23,42,.96);border:1px solid #334155;padding:10px;border-radius:12px;z-index:1000;font-size:11px}
#panel .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#panel .header span{font-weight:600;color:#cbd5e1}
#panel .closeBtn{background:transparent;border:none;color:#94a3b8;font-size:18px;cursor:pointer;padding:0 5px;line-height:1}
#panel .row{display:flex;gap:6px;margin-bottom:8px}
#panel .brush{flex:1;padding:12px 4px;border-radius:8px;color:#fff;border:2px solid #475569;font-size:11px;cursor:pointer;font-weight:600;text-align:center;transition:all .15s}
#panel .brush.active{border-color:#facc15;transform:scale(1.03)}
#panel .brush.b-red{background:#dc2626}
#panel .brush.b-blue{background:#2563eb}
#panel .sliderLabel{display:flex;justify-content:space-between;color:#cbd5e1;font-size:11px;margin-bottom:4px}
#panel .sliderLabel span:last-child{color:#facc15;font-weight:600}
#panel input[type=range]{width:100%;margin-bottom:8px}
#panel button.act{width:100%;padding:10px;margin-top:5px;background:#475569;color:#fff;border:none;border-radius:6px;font-size:11px;cursor:pointer;font-weight:600}
#panel button.act.active{background:#facc15;color:#111}
#panel button.danger{background:#7f1d1d}
#panel .hintTxt{color:#94a3b8;text-align:center;margin-top:6px;font-size:10px;line-height:1.4}

#openBtn{position:absolute;bottom:10px;left:8px;width:44px;height:44px;background:rgba(15,23,42,.96);border:1px solid #334155;border-radius:50%;color:#e2e8f0;font-size:20px;cursor:pointer;z-index:1000;display:flex;align-items:center;justify-content:center}

#legend{position:absolute;top:10px;left:8px;background:rgba(15,23,42,.9);border:1px solid #334155;padding:8px;border-radius:10px;z-index:1000;font-size:11px;line-height:1.8}
#legend .item{display:flex;align-items:center;gap:6px}
#legend .sw{width:14px;height:14px;border-radius:3px;border:1px solid #475569}

#hint{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(250,204,21,.95);color:#111;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;z-index:2000;max-width:80vw;text-align:center;display:none}
</style>
</head>
<body>

<div id="map"></div>
<div id="load">Загрузка карты...</div>

<div id="legend" class="hidden">
  <div class="item"><div class="sw" style="background:#3b82f6"></div>Украина</div>
  <div class="item"><div class="sw" style="background:#ef4444"></div>Россия</div>
</div>

<button id="openBtn" class="hidden">🎨</button>

<div id="panel" class="hidden">
  <div class="header">
    <span>🎨 Кисть</span>
    <button class="closeBtn" id="closeBtn">✕</button>
  </div>
  <div class="row">
    <button class="brush b-red active" data-color="#dc2626" data-country="UKR">🔴 УКР</button>
    <button class="brush b-blue" data-color="#2563eb" data-country="RUS">🔵 РФ</button>
  </div>
  <div class="sliderLabel">
    <span>📏 Серая зона</span>
    <span id="rval">4 км</span>
  </div>
  <input type="range" id="radius" min="1" max="15" value="4" step="1">
  <button class="act" id="drawBtn">✏️ Включить кисть</button>
  <button class="act danger" id="undoBtn">↩ Убрать последний</button>
  <button class="act danger" id="clearBtn">🗑 Убрать всё</button>
  <div class="hintTxt" id="hintTxt">Красная — по Украине</div>
</div>

<div id="hint"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script>
(function(){
  'use strict';

  var map;
  var currentColor = '#dc2626';
  var currentCountry = 'UKR';
  var drawMode = false;
  var currentPoints = [];
  var currentPreview = null;
  var startMarker = null;
  var GRAY_RADIUS_KM = 4;
  var STORAGE_KEY = 'war_sandbox_v10';

  // Цвет -> страна (для обрезки)
  var COLOR_COUNTRY = { '#dc2626': 'UKR', '#2563eb': 'RUS' };
  var OPPOSITE = { '#dc2626': '#2563eb', '#2563eb': '#dc2626' };

  var countryFeatures = { UKR: null, RUS: null };

  // Сырые штрихи (не сжатые) по цвету
  var strokes = { '#dc2626': [], '#2563eb': [] };

  // Слои: fill (заливка), gray (серая зона)
  var layers = {};

  function init(){
    map = L.map('map', {zoomControl:true, attributionControl:false}).setView([50, 34], 6);

    // ===== Esri спутник =====
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18,
      attribution: 'Tiles © Esri'
    }).addTo(map);

    // Подписи поверх спутника
    L.tileLayer('https://stamen-tiles-c.a.ssl.fastly.net/toner-labels/{z}/{x}/{y}.png', {
      maxZoom: 18,
      opacity: 0.7
    }).addTo(map);

    var brushes = document.querySelectorAll('.brush');
    brushes.forEach(function(b){
      b.addEventListener('click', function(){
        brushes.forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active');
        currentColor = b.getAttribute('data-color');
        currentCountry = b.getAttribute('data-country');
        document.getElementById('hintTxt').textContent =
          currentColor === '#dc2626' ? 'Красная — по Украине' : 'Синяя — по России';
      });
    });

    document.getElementById('drawBtn').addEventListener('click', toggleDraw);
    document.getElementById('undoBtn').addEventListener('click', undoLast);
    document.getElementById('clearBtn').addEventListener('click', clearAll);
    document.getElementById('closeBtn').addEventListener('click', function(){
      document.getElementById('panel').classList.add('hidden');
      document.getElementById('openBtn').classList.remove('hidden');
    });
    document.getElementById('openBtn').addEventListener('click', function(){
      document.getElementById('panel').classList.remove('hidden');
      document.getElementById('openBtn').classList.add('hidden');
    });

    var slider = document.getElementById('radius');
    slider.addEventListener('input', function(){
      GRAY_RADIUS_KM = parseInt(this.value);
      document.getElementById('rval').textContent = GRAY_RADIUS_KM + ' км';
      redrawAll();
    });

    var container = map.getContainer();
    container.addEventListener('touchstart', handleStart, {passive:false});
    container.addEventListener('touchmove', handleMove, {passive:false});
    container.addEventListener('touchend', handleEnd, {passive:false});
    container.addEventListener('touchcancel', handleEnd, {passive:false});
    container.addEventListener('mousedown', handleStart);
    container.addEventListener('mousemove', handleMove);
    container.addEventListener('mouseup', handleEnd);
    container.addEventListener('mouseleave', handleEnd);

    loadData();
  }

  // ===== Save/Load =====
  function saveAll() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(strokes)); } catch(e){}
  }
  function loadAll() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (data['#dc2626']) strokes['#dc2626'] = data['#dc2626'];
      if (data['#2563eb']) strokes['#2563eb'] = data['#2563eb'];
    } catch(e){}
  }

  // ===== Карта =====
  function loadData(){
    document.getElementById('load').textContent = 'Загрузка...';
    fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
      .then(function(r){ if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(data){
        data.features.forEach(function(f){
          var code = f.properties.ADM0_A3 || f.properties.adm0_a3 || '';
          if (code === 'UKR') countryFeatures.UKR = f;
          if (code === 'RUS') countryFeatures.RUS = f;
        });
        if (!countryFeatures.UKR || !countryFeatures.RUS) {
          document.getElementById('load').textContent = 'Не нашёл страны';
          return;
        }

        // Тонкие контуры стран поверх спутника
        L.geoJSON(countryFeatures.RUS, {style:{color:'#ffffff',weight:2,fillOpacity:0,opacity:0.7}}).addTo(map);
        L.geoJSON(countryFeatures.UKR, {style:{color:'#ffffff',weight:2,fillOpacity:0,opacity:0.9}}).addTo(map);

        // Крым — красный
        var crimea = [
          [46.15,33.6],[46.1,34.5],[45.9,35.2],[45.6,35.8],[45.4,36.5],[45.0,36.6],
          [44.8,36.1],[44.5,35.2],[44.4,34.5],[44.5,33.8],[44.7,33.5],[45.2,32.5],
          [45.7,32.5],[46.0,33.0]
        ];
        L.polygon(crimea, {color:'#dc2626',weight:1,fillColor:'#dc2626',fillOpacity:0.6,interactive:false}).addTo(map);

        try { map.fitBounds(L.geoJSON(countryFeatures.UKR).getBounds(), {padding:[20,20]}); } catch(e){}

        loadAll();
        redrawAll();
        document.getElementById('load').style.display = 'none';
        document.getElementById('legend').classList.remove('hidden');
        document.getElementById('panel').classList.remove('hidden');
      })
      .catch(function(e){ document.getElementById('load').textContent = 'Ошибка: ' + e.message; });
  }

  // ===== Режим =====
  function toggleDraw(){
    drawMode = !drawMode;
    var btn = document.getElementById('drawBtn');
    if (drawMode) {
      btn.textContent = '✖ Стоп';
      btn.classList.add('active');
      map.dragging.disable();
    } else {
      btn.textContent = '✏️ Включить кисть';
      btn.classList.remove('active');
      map.dragging.enable();
      cancelStroke();
    }
  }

  function cancelStroke() {
    if (currentPreview) { map.removeLayer(currentPreview); currentPreview = null; }
    if (startMarker) { map.removeLayer(startMarker); startMarker = null; }
    currentPoints = [];
  }

  function getLatLng(e) {
    var t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
    return map.mouseEventToLatLng(t);
  }

  function handleStart(e){
    if (!drawMode) return;
    if (e.touches && e.touches.length > 1) return;
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    var ll = getLatLng(e);
    currentPoints = [ll];

    startMarker = L.marker(ll, {
      icon: L.divIcon({
        className: '',
        html: '<div style="font-size:24px;line-height:1;filter:drop-shadow(0 2px 4px #000)">✏️</div>',
        iconSize: [24,24], iconAnchor: [12,12]
      }),
      interactive: false
    }).addTo(map);

    currentPreview = L.polygon(currentPoints, {
      color: '#facc15', weight: 3, opacity: 0.9,
      fillColor: currentColor, fillOpacity: 0.15,
      dashArray: '5,5'
    }).addTo(map);
  }

  function handleMove(e){
    if (!drawMode || !currentPreview) return;
    e.preventDefault();
    var ll = getLatLng(e);
    currentPoints.push(ll);
    currentPreview.setLatLngs(currentPoints);
  }

  function handleEnd(e){
    if (!drawMode || !currentPreview) return;
    e.preventDefault();
    var pts = currentPoints.slice();
    cancelStroke();
    if (pts.length < 3) { showHint('Слишком коротко'); return; }
    var arr = pts.map(function(ll){ return [ll.lat, ll.lng]; });
    addStroke(arr, currentColor, currentCountry);
  }

  // ===== Добавление штриха =====
  function addStroke(pts, color, countryCode) {
    var country = countryFeatures[countryCode];
    if (!country) return;

    // Формируем полигон
    var coords = pts.map(function(p){ return [p[1], p[0]]; });
    var first = coords[0], last = coords[coords.length-1];
    if (first[0] !== last[0] || first[1] !== last[1]) coords.push([first[0], first[1]]);

    var drawn = {
      type: 'Feature',
      geometry: { type: 'Polygon', coordinates: [coords] },
      properties: {}
    };

    // Обрезаем по стране
    var clipped = null;
    try { clipped = turf.intersect(drawn, country); } catch(e){}
    if (!clipped) {
      showHint(color === '#dc2626' ? '❌ Это не Украина' : '❌ Это не Россия');
      return;
    }

    // === ВЫТЕСНЕНИЕ ПРОТИВОПОЛОЖНОГО ЦВЕТА ===
    var otherColor = OPPOSITE[color];
    if (strokes[otherColor] && strokes[otherColor].length) {
      var newList = [];
      strokes[otherColor].forEach(function(s){
        try {
          var diff = turf.difference(s, clipped);
          if (diff) newList.push(diff);
        } catch(e){ newList.push(s); }
      });
      strokes[otherColor] = newList;
    }

    // Добавляем штрих
    if (!strokes[color]) strokes[color] = [];
    strokes[color].push(clipped);

    redrawAll();
    saveAll();
  }

  // ===== Перерисовка всего =====
  function redrawAll() {
    // Убираем старые слои
    Object.keys(layers).forEach(function(k){
      if (layers[k].fill) map.removeLayer(layers[k].fill);
      if (layers[k].gray) map.removeLayer(layers[k].gray);
    });
    layers = {};

    // ===== СЧИТАЕМ СЖАТЫЕ ЗАЛИВКИ И ОБЪЕДИНЁННЫЕ СЕРЫЕ =====
    var halfKm = GRAY_RADIUS_KM / 2;

    var fillByColor = {};   // цвет -> merged сжатая фича
    var grayAll = [];       // все серые (для слияния)

    ['#dc2626', '#2563eb'].forEach(function(color){
      var list = strokes[color] || [];
      if (!list.length) return;

      // Объединяем все штрихи цвета
      var merged = list[0];
      for (var i = 1; i < list.length; i++) {
        try { merged = turf.union(merged, list[i]); } catch(e){}
      }

      // Сжимаем внутрь на halfKm (отрицательный buffer)
      var shrinked = null;
      try {
        shrinked = turf.buffer(merged, -halfKm, {units: 'kilometers'});
      } catch(e){}

      if (shrinked) {
        fillByColor[color] = shrinked;
        // Серая зона вокруг сжатой фичи на halfKm
        try {
          var buffered = turf.buffer(shrinked, halfKm, {units: 'kilometers'});
          var ring = turf.difference(buffered, shrinked);
          if (ring) grayAll.push(ring);
        } catch(e){}
      } else {
        // Если фича меньше halfKm — она исчезает
      }
    });

    // Объединяем все серые в одну
    var grayMerged = null;
    if (grayAll.length) {
      grayMerged = grayAll[0];
      for (var j = 1; j < grayAll.length; j++) {
        try { grayMerged = turf.union(grayMerged, grayAll[j]); } catch(e){}
      }
    }

    // ===== РИСУЕМ =====
    // Серая зона — снизу
    if (grayMerged) {
      var grayLayer = L.geoJSON(grayMerged, {
        style: { color:'#9ca3af', weight:1, fillColor:'#9ca3af', fillOpacity:0.55, dashArray:'3,3' },
        interactive: false
      }).addTo(map);
      layers['gray'] = {fill: null, gray: grayLayer};
    }

    // Заливки цветов — сверху
    Object.keys(fillByColor).forEach(function(color){
      var fillLayer = L.geoJSON(fillByColor[color], {
        style: { color: color, weight: 2, fillColor: color, fillOpacity: 0.7 }
      }).addTo(map);
      layers['fill_' + color] = {fill: fillLayer, gray: null};
    });
  }

  // ===== Управление =====
  function undoLast(){
    var list = strokes[currentColor] || [];
    if (!list.length) { showHint('Нет штрихов'); return; }
    list.pop();
    redrawAll();
    saveAll();
  }

  function clearAll(){
    if (!confirm('Убрать все захваты?')) return;
    strokes['#dc2626'] = [];
    strokes['#2563eb'] = [];
    redrawAll();
    saveAll();
  }

  function showHint(t){
    var h = document.getElementById('hint');
    h.textContent = t;
    h.style.display = 'block';
    setTimeout(function(){ h.style.display = 'none'; }, 2000);
  }

  init();
})();
</script>
</body>
</html>
