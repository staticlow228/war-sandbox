<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Украина — Карта</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0f172a;color:#e2e8f0;overflow:hidden;height:100vh}
#map{position:absolute;inset:0;background:#0f172a}
#loading{position:fixed;inset:0;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(15,23,42,.98);padding:20px;text-align:center}
#loading .big{font-size:40px}
#loadingText{font-size:14px}
#legend{position:absolute;bottom:14px;left:14px;background:rgba(15,23,42,.95);border:1px solid #334155;padding:10px 12px;border-radius:10px;z-index:1000;font-size:12px;line-height:1.8}
#legend .item{display:flex;align-items:center;gap:8px}
#legend .sw{width:16px;height:16px;border-radius:3px;border:1px solid #475569}
#info{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.95);border:1px solid #334155;padding:8px 16px;border-radius:10px;z-index:1000;font-size:13px;font-weight:600}
</style>
</head>
<body>

<div id="loading">
  <div class="big">⏳</div>
  <div id="loadingText">Загрузка карты Украины...</div>
</div>

<div id="map"></div>

<div id="info">🇺🇦 Украина</div>

<div id="legend">
  <div class="item"><div class="sw" style="background:#3b82f6"></div>Украина</div>
  <div class="item"><div class="sw" style="background:#ef4444"></div>Оккупировано (Крым, ЛДНР)</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script>
(function() {
  'use strict';

  var map;
  var regions = [];
  var COLORS = { ukr: '#3b82f6', occupied: '#ef4444' };

  // Ключевые слова для оккупированных регионов
  function isOccupied(name) {
    var n = (name || '').toLowerCase();
    return n.indexOf('krym') !== -1        // Crimea / Krym
        || n.indexOf('crimea') !== -1
        || n.indexOf('sevastopol') !== -1
        || n.indexOf('donets') !== -1      // Donetsk
        || n.indexOf('luhans') !== -1;     // Luhansk
  }

  function init() {
    map = L.map('map', { zoomControl: true, attributionControl: false });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 12 }).addTo(map);

    document.getElementById('loadingText').textContent = 'Скачиваем границы областей Украины...';

    fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_1_states_provinces.geojson')
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(data) {
        // Только Украина
        var features = data.features.filter(function(f){
          return f.properties.adm0_a3 === 'UKR';
        });

        document.getElementById('loadingText').textContent = 'Рисуем ' + features.length + ' областей...';

        var allBounds = [];
        features.forEach(function(f) {
          var name = f.properties.name || '';
          var occ = isOccupied(name);
          var color = occ ? COLORS.occupied : COLORS.ukr;

          var layer = L.geoJSON(f, {
            style: {
              color: '#0f172a',
              weight: 1,
              fillColor: color,
              fillOpacity: 0.75
            }
          }).addTo(map);

          layer.bindTooltip(name + (occ ? ' (оккупировано)' : ''), { sticky: true });
          regions.push({ feature: f, layer: layer, name: name, occupied: occ });
        });

        // Госграница Украины — жирная линия поверх
        try {
          var merged = features[0];
          for (var i = 1; i < features.length; i++) {
            try { merged = turf.union(merged, features[i]); } catch(e) {}
          }
          L.geoJSON(merged, {
            style: { color: '#f8fafc', weight: 2.5, fillOpacity: 0, opacity: 0.9 },
            interactive: false
          }).addTo(map);
        } catch(e) { console.warn(e); }

        // Центрируем на Украине
        var group = L.featureGroup(regions.map(function(r){ return r.layer; }));
        map.fitBounds(group.getBounds(), { padding: [20, 20] });

        document.getElementById('loading').style.display = 'none';
      })
      .catch(function(e) {
        document.getElementById('loadingText').textContent = '❌ Ошибка: ' + e.message;
        console.error(e);
      });
  }

  init();
})();
</script>
</body>
</html>
